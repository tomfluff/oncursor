name: Build and deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Publishes dist/ to the gh-pages branch of visual-context/app, which
      # Pages serves at visual-context.github.io/app/. Auth is an SSH deploy
      # key: the private half is APP_DEPLOY_KEY here; the public half has write
      # access on visual-context/app.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.APP_DEPLOY_KEY }}
          external_repository: visual-context/app
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
